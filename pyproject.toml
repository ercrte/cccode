[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "julycode"
version = "0.1.0"
description = "A terminal AI coding assistant conversation MVP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "keyring>=24.3,<26",
    "PyYAML>=6.0",
    "textual>=0.86",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
julycode = "julycode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"julycode.skills.builtin" = ["*.md"]
"julycode.subagents.builtin" = ["*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
