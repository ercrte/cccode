name: test
on: 
  push: 
    branches: [master]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: 
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 代码检查
        run: ruff check .

      - name: 执行测试
        run: pytest -v
      
  